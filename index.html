<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d5b">
<title>My FoodPath+</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f7f2;--card:#fff;--ink:#1f2d27;--muted:#5f6f67;--line:#dde6df;--g:#2f7d5b;--g2:#e3f1e8;--o:#c46f1c;--o2:#fbeedd;--r:#b83227;--r2:#fbe5e2;--b:#3b6ea8;--b2:#e4edf7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;padding-bottom:86px}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top))}
header h1{font-size:20px;margin:0;letter-spacing:.2px}
header button{background:rgba(255,255,255,.18);border:0;color:#fff;font-size:15px;border-radius:10px;padding:7px 11px;font-weight:600}
main{max-width:640px;margin:0 auto;padding:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:7px 2px 9px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;font-family:inherit}
nav button span{font-size:21px}
nav button.on{color:var(--g);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:19px;margin:4px 0 12px}
h3{font-size:16.5px;margin:0 0 8px}
p{margin:6px 0}
.muted{color:var(--muted);font-size:14px}
.btn{display:inline-block;border:0;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600;background:var(--g);color:#fff;cursor:pointer;font-family:inherit}
.btn.s{background:var(--g2);color:var(--g)}
.btn.o{background:var(--o2);color:#8a4b0f}
.btn.r{background:var(--r2);color:var(--r)}
.btn.b{background:var(--b2);color:var(--b)}
.btn.sm{padding:6px 10px;font-size:13.5px}
.btn.full{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;background:#e6ede8;border-radius:12px;padding:3px;margin-bottom:12px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 2px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);font-family:inherit}
.seg button.on{background:#fff;color:var(--g);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.grow{flex:1;min-width:0}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--g2);color:var(--g);margin:2px 4px 2px 0;font-weight:600}
.tag.o{background:var(--o2);color:#8a4b0f}
.tag.b{background:var(--b2);color:var(--b)}
.tag.r{background:var(--r2);color:var(--r)}
.chk{width:28px;height:28px;border-radius:8px;border:2px solid var(--g);display:flex;align-items:center;justify-content:center;flex:none;background:#fff;color:#fff;font-weight:800;font-size:16px;padding:0}
.chk.on{background:var(--g)}
.done{text-decoration:line-through;color:var(--muted)}
.note{background:var(--o2);border-radius:12px;padding:10px 12px;font-size:14px;color:#6b3d0c;margin:8px 0}
.note.b{background:var(--b2);color:#234a75}
.note.g{background:var(--g2);color:#1f5a40}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:7px 12px;font-size:14px;font-family:inherit;color:var(--ink)}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.choice{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;font-size:14px;color:var(--muted);font-family:inherit}
.choice b{display:block;color:var(--ink);font-size:16px}
.choice.on{border-color:var(--g);background:var(--g2)}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;font-size:16px;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-family:inherit}
textarea{min-height:90px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom))}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{flex:1;min-width:88px;background:var(--g2);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:19px;color:var(--g)}
.stat span{font-size:12.5px;color:var(--muted)}
.bar{height:12px;background:#e6ede8;border-radius:10px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--g);border-radius:10px}
canvas{width:100%;height:210px;display:block}
.meal{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.meal:first-child{border-top:0}
.slot{font-size:11.5px;font-weight:700;color:var(--o);text-transform:uppercase;letter-spacing:.04em}
.dayhead{font-weight:700;margin:2px 0 4px;display:flex;justify-content:space-between;align-items:center}
ol,ul{padding-left:22px;margin:6px 0}
li{margin:3px 0}
.wiz{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto}
.wiz .in{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.dots{display:flex;gap:6px;justify-content:center;margin:4px 0 16px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--g)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#1f2d27;color:#fff;padding:10px 16px;border-radius:10px;z-index:50;font-size:14px;max-width:90%;text-align:center}
.empty{color:var(--muted);font-size:14px;padding:4px 0}
.link{background:none;border:0;color:var(--g);font-weight:600;font-size:14px;padding:6px 0;font-family:inherit}
.how{font-size:14.5px;color:var(--ink)}
.dotrow{display:flex;gap:4px}
.dotrow i{width:12px;height:12px;border-radius:50%;background:#e6ede8;display:inline-block}
.dotrow i.on{background:var(--g)}
.water{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.water span{font-size:22px;opacity:.25}
.water span.on{opacity:1}
</style>
</head>

<script>
/* ============ Storage ============ */
const KEY = 'myfoodpath_v1';
function defaults(){
  return {
    setup:false,
    prefs:{name:'',goal:'lose',curW:'',goalW:'',diet:'bal',ifWindow:'16:8',likes:[],dislikes:[],cannot:[],cookTime:30},
    plan:null, eaten:{},
    grocery:{checked:{},extra:[]},
    customRecipes:[],
    health:{logs:[],glucose:[],allergies:[],meds:[],restrictions:[],history:[]},
    fitness:{logs:[],walkStart:null},
    water:{}
  };
}
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && s.prefs){ const d = defaults(); return {...d, ...s, prefs:{...d.prefs,...s.prefs}, health:{...d.health,...s.health}, fitness:{...d.fitness,...s.fitness}, grocery:{...d.grocery,...s.grocery}}; }
  }catch(e){}
  return defaults();
}
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('Could not save — phone storage may be full'); } }

/* ============ Helpers ============ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function ds(d){ d = d || new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(s,n){ const d = new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return ds(d); }
function dayDiff(a,b){ return Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00'))/86400000); }
function fmtDate(s,long){ return new Date(s+'T12:00:00').toLocaleDateString(undefined, long?{weekday:'long',month:'short',day:'numeric'}:{weekday:'short',month:'short',day:'numeric'}); }
function fmtTime(t){ if(!t) return ''; const [h,m] = t.split(':').map(Number); return ((h%12)||12)+':'+String(m).padStart(2,'0')+(h<12?' AM':' PM'); }
function nowTime(){ const d = new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function weekStart(s){ const d = new Date(s+'T12:00:00'); return addDays(s, -((d.getDay()+6)%7)); }
function toast(msg){ document.querySelectorAll('.toast').forEach(x => x.remove()); const t = document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2600); }
const num = v => { const n = parseFloat(v); return isNaN(n) ? null : n; };

 {id:'b2',n:'Veggie Egg Scramble',m:'b',t:10,cal:280,tags:['hp','lc','bal'],ing:[['3','eggs','D'],['1 cup','fresh spinach','P'],['1/4 cup','diced bell pepper','P'],['1 tsp','olive oil','S'],['','salt and pepper','S']],st:['Heat the oil in a pan over medium heat.','Cook the pepper for 2 minutes, then add the spinach until it wilts.','Pour in the beaten eggs and stir gently until just set.','Season with salt and pepper.']},

 // ---- Lunch ----

const NOT_DAIRY = ['almond milk','oat milk','soy milk','coconut milk','peanut butter','any kind','dairy-free'];
function keywords(term){
  let t = String(term||'').toLowerCase().trim();
  if(!t) return [];
  if(GROUPS[t]) return GROUPS[t];
  if(t.endsWith('ies') && GROUPS[t.slice(0,-3)+'y']) return GROUPS[t.slice(0,-3)+'y'];
  if(t.endsWith('s') && GROUPS[t.slice(0,-1)]) return GROUPS[t.slice(0,-1)];
  const out = [t];
  if(t.endsWith('ies')) out.push(t.slice(0,-3)+'y');
  else if(t.endsWith('es')) out.push(t.slice(0,-2));
  if(t.endsWith('s')) out.push(t.slice(0,-1));
  return out;
}
function hitTerms(r, terms){
  const names = r.ing.map(i => String(i[1]).toLowerCase()).concat([r.n.toLowerCase()]);
  const found = [];
  for(const term of terms){
    for(const k of keywords(term)){
      const hit = names.some(nm => nm.includes(k) && !(['milk','butter','cream'].includes(k) && NOT_DAIRY.some(x => nm.includes(x))));
      if(hit){ found.push(term); break; }
    }
  }
  return found;
}

function recipeSwaps(r){
  const out = [], seen = new Set();
  for(const [, item] of r.ing){
    const nm = item.toLowerCase();
    const s = SWAPS.find(x => nm.includes(x[0]));
    if(s && !seen.has(s[0])){ seen.add(s[0]); out.push([item, s[1]]); }
  }
  return out.slice(0,5);
}

const SLOTS = ['b','l','d'];
function slotName(s){
  if(S.prefs.diet === 'if'){
    const w = IFW[S.prefs.ifWindow] || IFW['16:8'];
    return {b:'Meal 1 · '+fmtTime(w.s+':00'), l:'Meal 2', d:'Meal 3 · by '+fmtTime(w.e+':00')}[s];
  }
  return {b:'Breakfast', l:'Lunch', d:'Dinner'}[s];
}
function allRecipes(){ return R.concat(S.customRecipes); }
function getR(id){ return allRecipes().find(r => r.id === id); }
function blockTerms(){ return S.prefs.cannot.concat(S.health.allergies.map(a => a.name)); }
function isBlocked(r){ return hitTerms(r, blockTerms()).length > 0; }
function pool(m){
  const p = S.prefs, diet = p.diet === 'if' ? 'bal' : p.diet, tl = +p.cookTime || 999;
  const base = allRecipes().filter(r => r.m === m && !isBlocked(r));
  const fitsDiet = r => r.custom || r.tags.includes(diet);
  const notDis = r => !hitTerms(r, p.dislikes).length;
  const tries = [r => notDis(r) && fitsDiet(r) && r.t <= tl, r => notDis(r) && fitsDiet(r), r => notDis(r) && r.t <= tl, notDis];
  for(const f of tries){ const c = base.filter(f); if(c.length >= 3) return c; }
  return base;
}
function likeScore(r){ return hitTerms(r, S.prefs.likes).length * 3 + (r.custom ? 1 : 0); }
function makePlan(start){
  const used = {b:new Set(), l:new Set(), d:new Set()}, days = [];
  const pools = {b:pool('b'), l:pool('l'), d:pool('d')};
  for(let i=0;i<7;i++){
    const day = {};
    for(const s of SLOTS){
      let c = pools[s].filter(r => !used[s].has(r.id));
      if(!c.length){ used[s].clear(); c = pools[s]; }
      const pick = c.map(r => ({r, v:likeScore(r) + Math.random()*2.5})).sort((a,b) => b.v - a.v)[0];
      day[s] = pick ? pick.r.id : null;
      if(pick) used[s].add(pick.r.id);
    }
    days.push(day);
  }
  return {start, days, made:Date.now()};
}
function newPlan(){
  S.plan = makePlan(ds());
  S.grocery.checked = {};
  save(); render(); toast('New 7-day meal plan ready');
}
function planIndex(date){ if(!S.plan) return -1; const i = dayDiff(S.plan.start, date); return (i >= 0 && i < 7) ? i : -1; }

}
function weightBar(){
  const {start,cur,goal} = weightInfo();
  if(!cur) return `<p class="muted">Log your weight to start tracking.</p>`;
  let h = `<div class="stats" style="margin-top:10px"><div class="stat"><b>${start}</b><span>Start (lbs)</span></div><div class="stat"><b>${cur}</b><span>Now (lbs)</span></div>${goal?`<div class="stat"><b>${goal}</b><span>Goal (lbs)</span></div>`:''}</div>`;
  if(goal && start && start !== goal){
    const pct = Math.max(0, Math.min(100, Math.round((start-cur)/(start-goal)*100)));
    h += `<div class="bar"><i style="width:${pct}%"></i></div><div class="muted">${pct}% of the way to your goal${cur!==start?` · ${cur<start?'down':'up'} ${Math.abs(Math.round((cur-start)*10)/10)} lbs`:''}</div>`;
  }
  return h;
}

  let h = `<div class="card"><div class="between"><div><b>${fmtDate(S.plan.start)} – ${fmtDate(addDays(S.plan.start,6))}</b><div class="muted">${DIETS[S.prefs.diet].name}${+S.prefs.cookTime<999?' · up to '+S.prefs.cookTime+' min':''}</div></div><button class="btn sm s" onclick="if(confirm('Make a brand-new 7-day plan starting today?'))newPlan()">New plan</button></div>

function planEaten(){ if(!S.plan) return 0; let n=0; for(let i=0;i<7;i++) for(const s of SLOTS) if(S.eaten[addDays(S.plan.start,i)+'|'+s]) n++; return n; }
function tagsHTML(r){ return r.tags.map(t => `<span class="tag">${TAGNAME[t]||t}</span>`).join('') + (r.custom?'<span class="tag b">My recipe</span>':''); }
function openRecipe(id, date, slot){
  const r = getR(id); if(!r) return;

  let h = `<div class="between"><h2 style="margin:0">${esc(r.n)}</h2><button class="btn sm s" onclick="closeModal()">✕</button></div>

function openSwap(date, slot){

  let h = `<div class="between"><h2 style="margin:0">Swap ${slotName(slot).split(' ·')[0].toLowerCase()}</h2><button class="btn sm s" onclick="closeModal()">✕</button></div><p class="muted">${fmtDate(date,true)} · pick a meal that fits your plan</p>`;
  h += list.length ? list.map(r => `<div class="item"><div class="grow" onclick="doSwap('${date}','${slot}','${r.id}')" style="cursor:pointer"><b>${esc(r.n)}</b><div class="muted">${r.t} min${r.cal?' · about '+r.cal+' cal':''}</div></div><button class="btn sm" onclick="doSwap('${date}','${slot}','${r.id}')">Pick</button></div>`).join('') : '<p class="empty">No other meals match your choices yet.</p>';
  h += `<button class="btn s full" style="margin-top:10px" onclick="editRecipe(null,'${slot}')">+ Add my own recipe</button>`;
  openModal(h);
}
function doSwap(date, slot, id){ S.plan.days[dayDiff(S.plan.start,date)][slot] = id; delete S.eaten[date+'|'+slot]; save(); closeModal(); render(); toast('Meal swapped'); }

function groceryItems(){
  const map = {};
  if(!S.plan) return map;
  S.plan.days.forEach(d => SLOTS.forEach(s => {
    const r = getR(d[s]); if(!r) return;
    r.ing.forEach(([q,it,c]) => {
      const key = it.toLowerCase();
      const e = map[key] || (map[key] = {name:it, cat:c||'O', qty:{}});
      if(q) e.qty[q] = (e.qty[q]||0) + 1;
    });
  }));
  return map;
}
function qtyText(e){ return Object.entries(e.qty).map(([q,n]) => n>1 ? `${q} ×${n}` : q).join(', '); }
function vGrocery(){
  if(!S.plan) return `<div class="card"><p>Make a meal plan first, and your grocery list will build itself.</p><button class="btn" onclick="newPlan()">Make my 7-day plan</button></div>`;
  const items = groceryItems(), ck = S.grocery.checked;
  const total = Object.keys(items).length + S.grocery.extra.length;
  const done = Object.keys(items).filter(k => ck[k]).length + S.grocery.extra.filter(x => x.done).length;
  let h = `<div class="card"><div class="between"><div><b>Grocery list</b><div class="muted">For your 7-day plan · ${done} of ${total} checked</div></div><button class="btn sm s" onclick="shareList()">Share</button></div>
   <div class="muted" style="margin-top:6px">"×2" means two meals use it, so buy enough for both.</div></div>`;
  for(const c of Object.keys(CATS)){
    const list = Object.entries(items).filter(([,e]) => e.cat===c).sort((a,b) => a[1].name.localeCompare(b[1].name));
    if(!list.length) continue;
    h += `<div class="card"><h3>${CATS[c]}</h3>${list.map(([k,e]) => `<div class="item"><button class="chk ${ck[k]?'on':''}" onclick="gToggle('${encodeURIComponent(k)}')">${ck[k]?'✓':''}</button><div class="grow ${ck[k]?'done':''}">${esc(e.name)}${qtyText(e)?`<div class="muted">${esc(qtyText(e))}</div>`:''}</div></div>`).join('')}</div>`;
  }
  h += `<div class="card"><h3>My extra items</h3>${S.grocery.extra.map(x => `<div class="item"><button class="chk ${x.done?'on':''}" onclick="xToggle('${x.id}')">${x.done?'✓':''}</button><div class="grow ${x.done?'done':''}">${esc(x.name)}</div><button class="btn sm r" onclick="xDel('${x.id}')">✕</button></div>`).join('')||'<p class="empty">Add anything else you need, like coffee or paper towels.</p>'}
   <div class="row" style="margin-top:8px;flex-wrap:nowrap"><input id="xadd" placeholder="Add an item" onkeydown="if(event.key==='Enter')xAdd()"><button class="btn" onclick="xAdd()">Add</button></div></div>
   <button class="btn s full" onclick="gClear()">Uncheck everything</button>`;
  return h;
}
function gToggle(k){ k = decodeURIComponent(k); if(S.grocery.checked[k]) delete S.grocery.checked[k]; else S.grocery.checked[k] = true; save(); render(); }
function xToggle(id){ const x = S.grocery.extra.find(x => x.id===id); x.done = !x.done; save(); render(); }
function xDel(id){ S.grocery.extra = S.grocery.extra.filter(x => x.id!==id); save(); render(); }
function xAdd(){ const el = document.getElementById('xadd'), v = el.value.trim(); if(!v) return; S.grocery.extra.push({id:uid(), name:v, done:false}); save(); render(); setTimeout(()=>document.getElementById('xadd')?.focus(),0); }
function gClear(){ S.grocery.checked = {}; S.grocery.extra.forEach(x => x.done=false); save(); render(); }
function shareList(){
  const items = groceryItems(); let txt = 'My FoodPath+ grocery list\n';
  for(const c of Object.keys(CATS)){
    const list = Object.entries(items).filter(([k,e]) => e.cat===c && !S.grocery.checked[k]);

}

  if(!S.fitness.walkStart) return null;
  const n = Math.floor(dayDiff(S.fitness.walkStart, ds())/7) + 1;
  if(n > 6) return null;
  return {n, from:addDays(S.fitness.walkStart,(n-1)*7)};

  const wm = weekMinutes(weekStart(ds()));

function bpTag(s,d){ s=+s; d=+d; if(s>=180||d>=120) return '<span class="tag r">Very high — call your doctor</span>'; if(s>=130||d>=80) return '<span class="tag o">High</span>'; if(s>=120) return '<span class="tag o">Elevated</span>'; if(s<90||d<60) return '<span class="tag b">Low</span>'; return '<span class="tag">Normal</span>'; }

function logLine(l){

/* ===== Glucose CSV import ===== */
function splitCSV(line, delim){
  const out = []; let cur = '', q = false;
  for(let i=0;i<line.length;i++){
    const c = line[i];
    if(q){ if(c==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else q = false; } else cur += c; }
    else if(c==='"') q = true;
    else if(c===delim){ out.push(cur); cur=''; }
    else cur += c;
  }
  out.push(cur); return out.map(s => s.trim());
}
function parseTS(s){
  s = String(s||'').trim(); if(!s) return null;
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})[T ](\d{1,2}):(\d{2})/);
  if(m) return new Date(+m[1], m[2]-1, +m[3], +m[4], +m[5]).getTime();
  m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})\s+(\d{1,2}):(\d{2})(?::\d{2})?\s*([AaPp][Mm])?/);
  if(m){
    let a = +m[1], b = +m[2], hr = +m[4], mo = a, d = b;
    if(a > 12){ d = a; mo = b; }
    if(m[6]){ const pm = /p/i.test(m[6]); if(pm && hr < 12) hr += 12; if(!pm && hr === 12) hr = 0; }
    return new Date(+m[3], mo-1, d, hr, +m[5]).getTime();
  }
  const t = Date.parse(s); return isNaN(t) ? null : t;
}
function parseGlucoseCSV(text){
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  let hi = -1;
  for(let i=0;i<Math.min(lines.length,40);i++){ if(/glucose/i.test(lines[i]) && /(time|date)/i.test(lines[i])){ hi = i; break; } }
  if(hi < 0) throw new Error("Couldn't find blood sugar readings in this file. Make sure it's the .csv export from LibreView or Dexcom Clarity.");
  const hl = lines[hi], delim = [',',';','\t'].sort((a,b) => hl.split(b).length - hl.split(a).length)[0];
  const H = splitCSV(hl, delim).map(s => s.toLowerCase());
  let tc = H.findIndex(h => /timestamp/.test(h)); if(tc < 0) tc = H.findIndex(h => /(date|time)/.test(h));
  const gcols = H.map((h,i) => (/glucose/.test(h) && /(mg|mmol|value)/.test(h) && !/(change|rate|unit|trend)/.test(h)) ? i : -1).filter(i => i >= 0);
  if(tc < 0 || !gcols.length) throw new Error("This file doesn't look like a glucose monitor export.");
  const mmol = gcols.some(i => /mmol/.test(H[i]));
  const have = new Set(S.health.glucose.map(g => Math.round(g.t/60000)));
  let added = 0, skipped = 0;
  for(let i=hi+1;i<lines.length;i++){
    const c = splitCSV(lines[i], delim), t = parseTS(c[tc]); if(!t) continue;
    let v = null;
    for(const gi of gcols){ const n = parseFloat(String(c[gi]||'').replace(',','.')); if(!isNaN(n)){ v = n; break; } }
    if(v == null) continue;
    v = Math.round(mmol ? v*18 : v);
    const key = Math.round(t/60000);
    if(have.has(key)){ skipped++; continue; }
    have.add(key); S.health.glucose.push({t, v}); added++;
  }
  S.health.glucose.sort((a,b) => a.t - b.t);
  if(!added && !skipped) throw new Error('No readings were found in this file.');
  return {added, skipped};
}
function importGlucose(input){
  const f = input.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => { try{ const r = parseGlucoseCSV(rd.result); save(); render(); toast(r.added+' readings added'+(r.skipped?' ('+r.skipped+' were already here)':'')); }catch(e){ alert(e.message); } };
  rd.readAsText(f); input.value = '';
}

function tsOf(l){ return new Date(l.date+'T'+(l.time||'12:00')+':00').getTime(); }

/* ===== Charts ===== */
function setupCanvas(id){
  const c = document.getElementById(id); if(!c) return null;
  const dpr = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  c.width = w*dpr; c.height = h*dpr; const x = c.getContext('2d'); x.scale(dpr,dpr);
  x.font = '12px system-ui, sans-serif';
  return {x, w, h};
}
function lineChart(id, series, opt={}){
  charts.push(() => {
    const cv = setupCanvas(id); if(!cv) return; const {x,w,h} = cv;
    series.forEach(s => s.pts = s.pts.filter(p => p.y != null).sort((a,b) => a.x-b.x));
    const pts = series.flatMap(s => s.pts); if(!pts.length) return;
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    pts.forEach(p => { x0 = Math.min(x0,p.x); x1 = Math.max(x1,p.x); y0 = Math.min(y0,p.y); y1 = Math.max(y1,p.y); });
    if(opt.goal){ y0 = Math.min(y0,opt.goal); y1 = Math.max(y1,opt.goal); }
    if(x0 === x1){ x0 -= 86400000; x1 += 86400000; }
    const pad = Math.max(2,(y1-y0)*0.12); y0 = Math.floor(y0-pad); y1 = Math.ceil(y1+pad);
    const L = 40, Rt = 10, T = series.length>1 ? 26 : 10, B = 22;
    const X = v => L + (v-x0)/(x1-x0)*(w-L-Rt), Y = v => T + (1-(v-y0)/(y1-y0))*(h-T-B);
    x.strokeStyle = '#e3e9e5'; x.fillStyle = '#5f6f67'; x.lineWidth = 1;
    for(let i=0;i<=4;i++){ const v = y0 + (y1-y0)*i/4, yy = Y(v); x.beginPath(); x.moveTo(L,yy); x.lineTo(w-Rt,yy); x.stroke(); x.fillText(Math.round(v), 4, yy+4); }
    const fd = t => new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'});
    x.fillText(fd(x0), L, h-6); const e = fd(x1); x.fillText(e, w-Rt-x.measureText(e).width, h-6);
    if(opt.goal){ x.setLineDash([5,4]); x.strokeStyle = '#c46f1c'; x.beginPath(); x.moveTo(L,Y(opt.goal)); x.lineTo(w-Rt,Y(opt.goal)); x.stroke(); x.setLineDash([]); x.fillStyle = '#c46f1c'; x.fillText('Goal '+opt.goal, w-Rt-60, Y(opt.goal)-4); }
    series.forEach((s,si) => {
      x.strokeStyle = s.color; x.fillStyle = s.color; x.lineWidth = 2.2; x.beginPath();
      s.pts.forEach((p,i) => i ? x.lineTo(X(p.x),Y(p.y)) : x.moveTo(X(p.x),Y(p.y))); x.stroke();
      if(s.pts.length < 60) s.pts.forEach(p => { x.beginPath(); x.arc(X(p.x),Y(p.y),3,0,7); x.fill(); });
      if(series.length > 1){ const lx = L + si*Math.min(170,(w-L)/series.length); x.fillRect(lx,8,12,4); x.fillStyle = '#1f2d27'; x.fillText(s.label, lx+16, 14); }
    });
  });
}
function barChart(id, data, goal){
  charts.push(() => {
    const cv = setupCanvas(id); if(!cv) return; const {x,w,h} = cv;
    const L = 34, B = 22, T = 10, Rt = 6, max = Math.max(goal, ...data.map(d => d.v)) * 1.1;
    const Y = v => T + (1-v/max)*(h-T-B), bw = (w-L-Rt)/data.length;
    x.strokeStyle = '#e3e9e5'; x.fillStyle = '#5f6f67';
    for(let i=0;i<=3;i++){ const v = max*i/3; x.beginPath(); x.moveTo(L,Y(v)); x.lineTo(w-Rt,Y(v)); x.stroke(); x.fillText(Math.round(v), 2, Y(v)+4); }
    data.forEach((d,i) => {
      x.fillStyle = i === data.length-1 ? '#2f7d5b' : '#8fc4a8';
      const bh = (h-T-B) - (Y(d.v)-T); x.fillRect(L+i*bw+bw*0.18, Y(d.v), bw*0.64, Math.max(0,bh));
      x.fillStyle = '#5f6f67'; const tw = x.measureText(d.label).width; x.fillText(d.label, L+i*bw+bw/2-tw/2, h-6);
    });
    x.setLineDash([5,4]); x.strokeStyle = '#c46f1c'; x.beginPath(); x.moveTo(L,Y(goal)); x.lineTo(w-Rt,Y(goal)); x.stroke(); x.setLineDash([]);
  });
}

    if(f.type === 'select') h += `<select id="f_${f.k}">${f.options.map(op => { const [ov,ol] = Array.isArray(op) ? op : [op,op]; return `<option value="${esc(ov)}" ${String(ov)===String(val)?'selected':''}>${esc(ol)}</option>`; }).join('')}</select>`;
    else if(f.type === 'textarea') h += `<textarea id="f_${f.k}" placeholder="${esc(f.ph||'')}">${esc(val)}</textarea>`;
    else if(f.type === 'checks'){ const arr = Array.isArray(val) ? val : []; h += `<div class="chips" id="f_${f.k}">${f.options.map(([ov,ol]) => `<button type="button" class="chip ${arr.includes(ov)?'on':''}" data-v="${ov}" onclick="this.classList.toggle('on')">${esc(ol)}</button>`).join('')}</div>`; }
    else h += `<input id="f_${f.k}" type="${f.type||'text'}" ${f.step?`step="${f.step}"`:''} ${f.type==='number'?'inputmode="decimal"':''} value="${esc(val)}" placeholder="${esc(f.ph||'')}">`;
  });
  h += `<div class="row" style="margin-top:18px"><button class="btn" onclick="saveForm()">Save</button><button class="btn s" onclick="closeModal()">Cancel</button>${o.onDelete?`<button class="btn r" style="margin-left:auto" onclick="delForm()">Delete</button>`:''}</div>`;
  openModal(h);
}
function saveForm(){
  const o = FORM, out = {};
  for(const f of o.fields){
    const el = document.getElementById('f_'+f.k);
    out[f.k] = f.type === 'checks' ? [...el.querySelectorAll('.chip.on')].map(b => b.dataset.v) : el.value.trim();
    if(f.req && !out[f.k]){ toast('Please fill in: ' + f.label); return; }
  }
  if(o.onSave(out) === false) return;
  closeModal(); save(); render();
}
function delForm(){ if(confirm('Delete this? This can\'t be undone.')){ FORM.onDelete(); closeModal(); save(); render(); } }

/* ============ Setup wizard ============ */
let W = null;
const CHIPS = {
  cannot:['Dairy','Gluten','Eggs','Peanuts','Tree nuts','Fish','Shellfish','Soy','Pork','Beef','Vegetarian','Vegan'],
  likes:['Chicken','Turkey','Fish','Shrimp','Eggs','Beans','Tofu','Salads','Berries','Avocado','Yogurt','Oats'],
  dislikes:['Mushrooms','Olives','Tofu','Fish','Shrimp','Avocado','Spinach','Beans','Eggs','Cottage cheese']
};
const inChips = (k,x) => CHIPS[k].some(c => c.toLowerCase() === String(x).toLowerCase());
function openWizard(){
  closeModal();
  const p = S.prefs; W = {step:0, ...JSON.parse(JSON.stringify(p))};
  for(const k of ['cannot','likes','dislikes']){ W[k+'C'] = p[k].filter(x => inChips(k,x)); W[k+'O'] = p[k].filter(x => !inChips(k,x)).join(', '); }
  renderWiz();
}
function wchoice(k,v){ W[k] = v; renderWiz(); }
function wchip(k,v){ const a = W[k+'C'], i = a.indexOf(v); if(i >= 0) a.splice(i,1); else a.push(v); renderWiz(); }
function chipBlock(k){ return `<div class="chips">${CHIPS[k].map(c => `<button class="chip ${W[k+'C'].includes(c)?'on':''}" onclick="wchip('${k}','${c}')">${c}</button>`).join('')}</div>
  <label>Other (separate with commas)</label><input value="${esc(W[k+'O'])}" oninput="W['${k}O']=this.value" placeholder="e.g. ${k==='cannot'?'sesame, strawberries':k==='likes'?'sweet potatoes, salmon':'cauliflower, beets'}">`; }
const STEPS = 6;
function renderWiz(){
  let el = document.getElementById('wiz');
  if(!el){ el = document.createElement('div'); el.className = 'wiz'; el.id = 'wiz'; document.body.appendChild(el); }
  const s = W.step; let h = '';
  if(s === 0) h = `<h2>Welcome to My FoodPath+ 🥗</h2><p>Answer a few quick questions and you'll get a 7-day meal plan, recipes, and a grocery list made for you. You can change any of this later.</p>
    <label>Your first name (optional)</label><input value="${esc(W.name)}" oninput="W.name=this.value" placeholder="First name">`;
  if(s === 1) h = `<h2>What's your main goal?</h2>${Object.entries(GOALS).map(([k,l]) => `<button class="choice ${W.goal===k?'on':''}" onclick="wchoice('goal','${k}')"><b>${l}</b>${{lose:'Smaller portions and filling, healthy meals.',maintain:'Stay where you are with balanced eating.',healthy:'Better food choices, whatever your weight.'}[k]}</button>`).join('')}
    <div class="grid2"><div><label>Current weight (lbs)</label><input type="number" inputmode="decimal" value="${esc(W.curW)}" oninput="W.curW=this.value" placeholder="Optional"></div>
    <div><label>Goal weight (lbs)</label><input type="number" inputmode="decimal" value="${esc(W.goalW)}" oninput="W.goalW=this.value" placeholder="Optional"></div></div>`;
  if(s === 2){
    h = `<h2>Pick an eating style</h2>${Object.entries(DIETS).map(([k,d]) => `<button class="choice ${W.diet===k?'on':''}" onclick="wchoice('diet','${k}')"><b>${d.name}</b>${d.d}</button>`).join('')}`;
    if(W.diet === 'if') h += `<label>Fasting schedule</label><select onchange="W.ifWindow=this.value">${Object.entries(IFW).map(([k,v]) => `<option value="${k}" ${W.ifWindow===k?'selected':''}>${v.label}</option>`).join('')}</select>
      <div class="note">⚠️ Intermittent fasting isn't right for everyone. If you take medicine for blood sugar or blood pressure, are pregnant, or have other health conditions, talk with your doctor before starting.</div>`;
  }
  if(s === 3) h = `<h2>Foods you can't eat</h2><p class="muted">Allergies, intolerances, or foods you avoid for health or faith. These will <b>never</b> show up in your meals.</p>${chipBlock('cannot')}`;
  if(s === 4) h = `<h2>Foods you like and dislike</h2><label>😋 Foods you like (shown more often)</label>${chipBlock('likes')}<label style="margin-top:18px">🙅 Foods you dislike (left out when possible)</label>${chipBlock('dislikes')}`;
  if(s === 5) h = `<h2>How much time do you have to cook?</h2>${[[15,'15 minutes or less','Quick meals only.'],[30,'Up to 30 minutes','Most weeknight meals.'],[45,'Up to 45 minutes','Room for soups and baked dishes.'],[999,"Time doesn't matter",'Show me everything.']].map(([v,l,d]) => `<button class="choice ${+W.cookTime===v?'on':''}" onclick="wchoice('cookTime',${v})"><b>${l}</b>${d}</button>`).join('')}`;
  const last = s === STEPS-1;
  el.innerHTML = `<div class="in"><div class="dots">${Array.from({length:STEPS},(_,i) => `<i class="${i<=s?'on':''}"></i>`).join('')}</div>${h}
    <div class="row" style="margin-top:22px">${s>0?`<button class="btn s" onclick="W.step--;renderWiz()">‹ Back</button>`:''}${S.setup?`<button class="btn s" onclick="closeWiz()">Cancel</button>`:''}
    <button class="btn" style="margin-left:auto" onclick="${last?'finishWiz()':'W.step++;renderWiz()'}">${last?(S.setup?'Save':'Make my meal plan 🎉'):'Next ›'}</button></div></div>`;
  el.scrollTop = 0;
}
function closeWiz(){ document.getElementById('wiz')?.remove(); W = null; }
function finishWiz(){
  const lists = {};
  for(const k of ['cannot','likes','dislikes']) lists[k] = [...new Set(W[k+'C'].concat(String(W[k+'O']||'').split(',').map(x => x.trim()).filter(Boolean)))];
  const old = JSON.stringify([S.prefs.diet,S.prefs.cannot,S.prefs.likes,S.prefs.dislikes,S.prefs.cookTime]);
  S.prefs = {name:W.name.trim(), goal:W.goal, curW:W.curW, goalW:W.goalW, diet:W.diet, ifWindow:W.ifWindow, cookTime:+W.cookTime, ...lists};
  const firstTime = !S.setup;
  if(firstTime && num(W.curW) && !S.health.logs.some(l => l.type==='weight')) S.health.logs.push({id:uid(),type:'weight',date:ds(),time:nowTime(),notes:'Starting weight',v:{w:W.curW}});
  S.setup = true;
  const changed = old !== JSON.stringify([S.prefs.diet,S.prefs.cannot,S.prefs.likes,S.prefs.dislikes,S.prefs.cookTime]);
  if(firstTime || !S.plan) { S.plan = makePlan(ds()); S.grocery.checked = {}; }
  else if(changed && confirm('Make a new 7-day meal plan with your new choices?')){ S.plan = makePlan(ds()); S.grocery.checked = {}; }
  else if(S.plan) fixPlan();
  save(); closeWiz(); render();
  if(firstTime) toast('Your 7-day meal plan is ready!');
}

/* ============ Settings, backup ============ */
function openSettings(){
  openModal(`<div class="between"><h2 style="margin:0">⚙️ Settings</h2><button class="btn sm s" onclick="closeModal()">✕</button></div>
   <div class="item"><div class="grow"><b>Edit my food preferences</b><div class="muted">Goal, eating style, foods, cooking time</div></div><button class="btn sm" onclick="openWizard()">Edit</button></div>
   <div class="item"><div class="grow"><b>Make a new meal plan</b><div class="muted">A fresh 7 days starting today</div></div><button class="btn sm s" onclick="closeModal();newPlan()">New plan</button></div>
   <div class="item"><div class="grow"><b>Back up my data</b><div class="muted">Saves a password-protected file to your phone</div></div><button class="btn sm s" onclick="backupStart()">Back up</button></div>
   <div class="item"><div class="grow"><b>Restore from a backup</b><div class="muted">Replaces what's in the app now</div></div><label class="btn sm s">Restore<input type="file" accept=".json,application/json" style="display:none" onchange="restoreFile(this)"></label></div>
   <div class="item"><div class="grow"><b>Erase everything</b><div class="muted">Start over from scratch</div></div><button class="btn sm r" onclick="eraseAll()">Erase</button></div>
   <div class="note b" style="margin-top:14px">Everything you enter stays on this phone. Nothing is sent anywhere.</div>
   <p class="muted">My FoodPath+ gives general food and activity ideas, not medical advice. Talk with your doctor or a dietitian about what's right for you, especially if you have a health condition or take medicine.</p>`);
}
function b64(u8){ let s = ''; for(let i=0;i<u8.length;i+=8192) s += String.fromCharCode.apply(null, u8.subarray(i,i+8192)); return btoa(s); }
function unb64(s){ const b = atob(s), u = new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i] = b.charCodeAt(i); return u; }
async function keyFrom(pw, salt){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:200000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
function backupStart(){
  openForm({title:'Back up my data', fields:[{k:'pw',label:'Make a password for this backup',type:'password',req:1},{k:'pw2',label:'Type it again',type:'password',req:1}],
    onSave: v => {
      if(v.pw !== v.pw2){ toast("Passwords don't match"); return false; }
      if(v.pw.length < 4){ toast('Use at least 4 characters'); return false; }
      doBackup(v.pw);
    }});
  document.querySelector('.modal h2').insertAdjacentHTML('afterend','<div class="note">Write this password down. Without it, the backup can\'t be opened.</div>');
}
async function doBackup(pw){
  try{
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await keyFrom(pw, salt);
    const data = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(S))));
    const file = JSON.stringify({app:'myfoodpath', v:1, salt:b64(salt), iv:b64(iv), data:b64(data)});
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([file], {type:'application/json'}));
    a.download = 'MyFoodPath-backup-' + ds() + '.json'; document.body.appendChild(a); a.click(); a.remove();
    toast('Backup saved to your Downloads');
  }catch(e){ alert('Backup failed: ' + e.message); }
}
function restoreFile(input){
  const f = input.files[0]; if(!f) return; input.value = '';
  const rd = new FileReader();
  rd.onload = () => {
    let obj; try{ obj = JSON.parse(rd.result); }catch(e){ alert("That file isn't a My FoodPath+ backup."); return; }
    if(obj.app !== 'myfoodpath'){ alert("That file isn't a My FoodPath+ backup."); return; }
    openForm({title:'Restore backup', fields:[{k:'pw',label:'Backup password',type:'password',req:1}], onSave: v => { doRestore(obj, v.pw); }});
  };
  rd.readAsText(f);
}
async function doRestore(obj, pw){
  try{
    const key = await keyFrom(pw, unb64(obj.salt));
    const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(obj.iv)}, key, unb64(obj.data));
    const data = JSON.parse(new TextDecoder().decode(plain));
    if(!data.prefs) throw new Error();
    if(!confirm('Replace everything in the app with this backup?')) return;
    localStorage.setItem(KEY, JSON.stringify(data)); S = load(); render(); toast('Backup restored');
  }catch(e){ alert('Wrong password, or the backup file is damaged.'); }
}
function eraseAll(){
  if(!confirm('Erase ALL your data in My FoodPath+? This cannot be undone.')) return;
  if(!confirm('Are you sure? Consider making a backup first.')) return;
  localStorage.removeItem(KEY); location.reload();
}

/* ============ Start ============ */
render();
if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
